ktor {
  deployment {
    port = 8080
    shutdownTimeout = 15000
  }
  application {
    modules = [no.nav.tsm.ApplicationKt.module]
  }
}

postgres {
  # Used to allow setting the DB url locally
  url = "postgresql://localhost:7967/regulus-maximus"
  url = ${?DB_URL}
  jdbc = "jdbc:"${postgres.url}
  r2dbc = {
    url = "r2dbc:"${postgres.url}
  }
  username = "user"
  username = ${?DB_USERNAME}
  password = "password"
  password = ${?DB_PASSWORD}
}

behandlingsdager {
  ids = ","
  ids = ${?BEHANDLINGSDAGER_IDS}
}

app {
  name = "local-regulus-maximus"
}
