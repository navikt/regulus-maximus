ktor {
  deployment {
    port = 8080
    shutdownTimeout = 15000
  }
  application {
    modules = [no.nav.tsm.ApplicationKt.module]
  }
}

postgres {
  jdbc = ${DB_JDBC_URL}
  username = ${DB_USERNAME}
  password = ${DB_PASSWORD}
}

behandlingsdager {
  ids = ${BEHANDLINGSDAGER_IDS}
}

app {
  name = ${NAIS_POD_NAME}
}
external {
  tsmBehandler = "http://tsm-behandler.tsm"
}